name: Daily Stock Price Update

on:
  schedule:
    # 每天台灣時間下午 14:15 (UTC 06:15) 週一至週五自動執行
    - cron: '15 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊「Run workflow」立即執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 執行抓取收盤價
        run: python fetch_data.py

      - name: 自動提交並推送更新
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新收盤價 [skip ci]" && git push)
