<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網球學習系統 - 智慧進階版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .note-card { transition: all 0.3s ease; border-top-width: 4px; }
        .note-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .tag-forehand { background: #fee2e2; color: #dc2626; }
        .tag-backhand { background: #dcfce7; color: #16a34a; }
        .tag-serve { background: #fef9c3; color: #ca8a04; }
        .tag-volley { background: #e0f2fe; color: #0284c7; }
        .tag-grip { background: #f3e8ff; color: #9333ea; }
        .category-btn.active { background-color: #1e293b; color: white; border-color: #1e293b; }
        #importModal { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <nav class="bg-slate-800 text-white shadow-xl p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-black tracking-wider">
                <i class="fas fa-skating mr-2 text-yellow-400"></i>TENNIS LOG PRO
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="openAddModal()" class="bg-yellow-400 hover:bg-yellow-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-black transition-transform active:scale-95">
                    <i class="fas fa-plus-circle mr-1"></i>新增筆記
                </button>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="搜尋動作要領..." 
                        class="pl-9 pr-4 py-1.5 rounded-full text-gray-800 text-sm focus:ring-2 focus:ring-yellow-400 outline-none w-48 md:w-64">
                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <div class="flex flex-wrap gap-2 mb-8 items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <span class="text-xs font-bold text-gray-400 mr-2 uppercase">快速過濾:</span>
            <button onclick="filterNotes('all')" class="px-4 py-1 bg-slate-200 rounded-full text-xs font-bold hover:bg-slate-300">全部</button>
            <button onclick="filterNotes('正拍')" class="px-4 py-1 tag-forehand rounded-full text-xs font-bold border border-red-100">正拍</button>
            <button onclick="filterNotes('反拍')" class="px-4 py-1 tag-backhand rounded-full text-xs font-bold border border-green-100">反拍</button>
            <button onclick="filterNotes('發球')" class="px-4 py-1 tag-serve rounded-full text-xs font-bold border border-yellow-100">發球</button>
            <button onclick="filterNotes('截擊')" class="px-4 py-1 tag-volley rounded-full text-xs font-bold border border-blue-100">截擊/切球</button>
        </div>

        <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="importModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl w-full max-w-xl shadow-2xl overflow-hidden shadow-indigo-500/20">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black text-slate-800">新增學習筆記</h3>
                    <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">課程日期</label>
                        <input type="date" id="newNoteDate" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-400 outline-none font-bold text-slate-700">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">技術分類 (可多選)</label>
                        <div id="categoryPicker" class="flex flex-wrap gap-2">
                            <button type="button" onclick="this.classList.toggle('active')" class="category-btn px-4 py-1.5 border border-gray-200 rounded-lg text-xs font-bold transition-all">正拍</button>
                            <button type="button" onclick="this.classList.toggle('active')" class="category-btn px-4 py-1.5 border border-gray-200 rounded-lg text-xs font-bold transition-all">反拍</button>
                            <button type="button" onclick="this.classList.toggle('active')" class="category-btn px-4 py-1.5 border border-gray-200 rounded-lg text-xs font-bold transition-all">截擊</button>
                            <button type="button" onclick="this.classList.toggle('active')" class="category-btn px-4 py-1.5 border border-gray-200 rounded-lg text-xs font-bold transition-all">切球</button>
                            <button type="button" onclick="this.classList.toggle('active')" class="category-btn px-4 py-1.5 border border-gray-200 rounded-lg text-xs font-bold transition-all">發球</button>
                            <button type="button" onclick="this.classList.toggle('active')" class="category-btn px-4 py-1.5 border border-gray-200 rounded-lg text-xs font-bold transition-all">其他</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">筆記內容</label>
                        <textarea id="newNoteContent" class="w-full h-40 p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-400 outline-none text-sm" placeholder="輸入今天的技術心得..."></textarea>
                    </div>
                </div>

                <div class="mt-8 flex gap-3">
                    <button onclick="saveNewNote()" class="flex-1 bg-slate-800 text-white py-4 rounded-xl font-black hover:bg-slate-700 transition shadow-xl">儲存筆記</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tennisData = [
            /* ... 原有資料庫內容 (為節省長度，這裡由原本代碼中的 1/7 到 12/9 組成) ... */
            { date: "1/7", tech: "正拍", content: "右手上拍伸直，左手平行。靠腰轉動擊球。手肘收在下巴。" },
            { date: "1/16", tech: "正拍", content: "拉拍頂點放鬆，下拍自然放下，轉動髖骨擊球。" },
            { date: "1/21", tech: "正拍 反拍", content: "先拉拍再移動。長球退後抓距離，短球跑場中。" },
            { date: "1/25", tech: "正拍 反拍", content: "正拍左手不掉。反拍重心左腳移右腳後跨左腳。" },
            { date: "2/4", tech: "正拍 反拍", content: "手腕90度。反拍跨大步，放鬆打球。" },
            { date: "2/11", tech: "正拍 反拍 發球", content: "雨刷向上刷。發球向後倒，拋球11:30-12:30。" },
            { date: "2/18", tech: "正拍 腳步 發球", content: "打直線練控球。橫移用腳尖防翻船。拋球左手指球。" },
            { date: "2/25", tech: "正拍 反拍 發球 腳步", content: "擊球要蹲、要挺胸。對打要原地跳起(Split Step)。" },
            { date: "3/14", tech: "正拍 反拍 發球", content: "左手背頂右手肘固定。發球像甩鞭子甩出。" },
            { date: "3/25", tech: "正拍", content: "用右腳左手找球。微蹲帶動髖骨。" },
            { date: "3/27", tech: "正拍", content: "拍面朝自己，提前拉拍，重心在後。" },
            { date: "4/15", tech: "正拍 腳步", content: "原地跳完拉拍。兩腳不墊腳。延遲出拍。" },
            { date: "4/22", tech: "正拍 截擊", content: "正拍L型推刷球。切球握刀拍V型拉拍，由左上往右下。" },
            { date: "5/6", tech: "正拍", content: "拍底朝球，轉動甩出。利用轉身刷球過網。" },
            { date: "5/13", tech: "正拍 腳步", content: "對打預備：扶拍/轉身/固定/腳步。屁股要頂。" },
            { date: "5/20", tech: "正拍", content: "最高點放鬆，擊球左腳跨出不跳開。打完抱胸。" },
            { date: "6/2", tech: "正拍 反拍 發球 截擊", content: "正拍左手縮，發球肘前伸，截擊左腳跨出。" },
            { date: "6/10", tech: "握拍 發球", content: "食指分開握法。發球肘向前，用甩的收拍。" },
            { date: "6/16", tech: "握拍 正拍", content: "指間無縫隙。纏兩層握把布。正拍右腳踩穩。" },
            { date: "7/1", tech: "正拍 反拍 截擊", content: "正拍用踩的。截擊手腕轉45度嚴禁拉拍。" },
            { date: "7/22", tech: "截擊", content: "正截踩左腳，反截踩右腳。往前方下壓。" },
            { date: "9/2", tech: "正拍 發球", content: "擊球點靠近身體打直線。發球向右畫彩虹。" },
            { date: "9/9", tech: "正拍 反拍 發球", content: "軟球小碎步側身攻擊。發球右手貼近後腦。" },
            { date: "9/16", tech: "發球 正拍", content: "上旋發球向上刷，擊球點7點。正拍黏球。" },
            { date: "9/30", tech: "正拍 反拍", content: "高球左手伸，踩開放式。中場軟球先轉身。" },
            { date: "10/7", tech: "截擊", content: "切球身體壓。小球45度滑過網。" },
            { date: "10/28", tech: "反拍", content: "拉拍舉高擊球放低。身體轉動出擊。" },
            { date: "11/4", tech: "正拍 發球", content: "右手拉拍放鬆。發球似梳頭方向。" },
            { date: "12/2", tech: "正拍", content: "提早拉拍。打延伸不打薄。開放式右腳跳。" },
            { date: "12/9", tech: "正拍 反拍", content: "等球轉身不急。反拍收拍收高。" }
        ];

        // 開啟彈窗並帶入今日日期
        function openAddModal() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('newNoteDate').value = `${year}-${month}-${day}`;
            
            // 重設分類選擇器狀態
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            toggleModal(true);
        }

        function sortAndRender() {
            // 排序邏輯
            tennisData.sort((a, b) => {
                const [aM, aD] = a.date.split('/').map(Number);
                const [bM, bD] = b.date.split('/').map(Number);
                return aM !== bM ? aM - bM : aD - bD;
            });

            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            
            tennisData.forEach(note => {
                const card = document.createElement('div');
                card.className = "note-card bg-white p-6 rounded-3xl shadow-sm border-slate-800";
                card.setAttribute('data-tech', note.tech);
                
                let tags = note.tech.split(' ').map(t => {
                    let cls = "bg-slate-100 text-slate-500";
                    if(t === "正拍") cls = "tag-forehand";
                    if(t === "反拍") cls = "tag-backhand";
                    if(t === "發球") cls = "tag-serve";
                    if(t === "截擊" || t === "切球") cls = "tag-volley";
                    if(t === "握拍") cls = "tag-grip";
                    return `<span class="${cls} text-[10px] px-2.5 py-1 rounded-full font-black mr-1">${t}</span>`;
                }).join('');

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-slate-800 text-white px-3 py-1 rounded-xl text-xs font-black">${note.date}</div>
                        <div class="flex flex-wrap justify-end gap-1">${tags}</div>
                    </div>
                    <div class="text-gray-700 text-sm leading-relaxed whitespace-pre-line font-medium">${note.content}</div>
                `;
                container.appendChild(card);
            });
        }

        function saveNewNote() {
            const dateInput = document.getElementById('newNoteDate').value;
            const content = document.getElementById('newNoteContent').value;
            if(!dateInput || !content) return alert("日期與內容都要填寫喔！");

            // 格式化日期從 2025-12-24 變成 12/24
            const parts = dateInput.split('-');
            const formattedDate = `${parseInt(parts[1])}/${parseInt(parts[2])}`;

            // 獲取選中的分類
            let selectedTechs = [];
            document.querySelectorAll('.category-btn.active').forEach(btn => {
                selectedTechs.push(btn.innerText);
            });
            if(selectedTechs.length === 0) selectedTechs.push("其他");

            tennisData.push({ 
                date: formattedDate, 
                tech: selectedTechs.join(' '), 
                content: content 
            });

            sortAndRender();
            toggleModal(false);
            document.getElementById('newNoteContent').value = '';
        }

        function toggleModal(s) { document.getElementById('importModal').style.display = s ? 'flex' : 'none'; }

        // 搜尋
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.note-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none';
            });
        });

        // 快速過濾
        function filterNotes(tech) {
            document.querySelectorAll('.note-card').forEach(card => {
                if(tech === 'all') card.style.display = 'block';
                else card.style.display = card.getAttribute('data-tech').includes(tech) ? 'block' : 'none';
            });
        }

        // 初始化
        sortAndRender();
    </script>
</body>
</html>
