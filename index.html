<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持股損益月曆 - 0050 & 00685L</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121417; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .gain-text { color: #f87171; }
    .loss-text { color: #4ade80; }
    .neutral-text { color: #9ca3af; }
    .card-bg { background-color: #1e2229; }
    .cell-gain { background-color: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); }
    .cell-loss { background-color: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.25); }
    .cell-empty { background-color: #16191f; border: 1px solid #242a35; }
    .cell-week { background-color: #1a1e27; border: 1px solid #2d3544; }
  </style>
</head>
<body class="p-3 md:p-6 max-w-4xl mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- 頂部控制列 -->
    <header class="flex justify-between items-center mb-4">
      <div class="flex items-center space-x-3">
        <button onclick="changeMonth(-1)" class="p-2 rounded bg-gray-800 hover:bg-gray-700 text-gray-300">‹</button>
        <h2 id="currentMonthLabel" class="text-xl md:text-2xl font-bold tracking-wide">2026/11 報酬</h2>
        <button onclick="changeMonth(1)" class="p-2 rounded bg-gray-800 hover:bg-gray-700 text-gray-300">›</button>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="syncDataJson()" class="px-3 py-1.5 text-xs md:text-sm bg-blue-600 hover:bg-blue-500 rounded text-white font-medium transition">
          重新整理資料
        </button>
        <button onclick="openBackupModal()" class="p-2 rounded bg-gray-800 hover:bg-gray-700 text-gray-300" title="備份/匯入">
          💾
        </button>
      </div>
    </header>

    <!-- 當月總計 -->
    <div class="grid grid-cols-2 gap-4 mb-5 p-4 rounded-xl bg-gray-900 border border-gray-800">
      <div>
        <div class="text-xs text-gray-400">當月累積損益 (元)</div>
        <div id="monthlyPnlVal" class="text-2xl md:text-3xl font-extrabold mt-1 tracking-tight">0</div>
      </div>
      <div class="text-right">
        <div class="text-xs text-gray-400">當月總報酬率</div>
        <div id="monthlyReturnVal" class="text-2xl md:text-3xl font-extrabold mt-1 tracking-tight">0.00%</div>
      </div>
    </div>

    <!-- 月曆 -->
    <div class="rounded-xl overflow-hidden border border-gray-800 bg-gray-900/60 shadow-xl p-2 md:p-4">
      <div class="grid grid-cols-6 gap-1 md:gap-2 text-center text-xs md:text-sm text-gray-400 font-semibold mb-2">
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div class="text-amber-400">週損益</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-6 gap-1 md:gap-2"></div>
    </div>

    <!-- 持股部位 -->
    <div class="mt-6 p-4 rounded-xl card-bg border border-gray-800 text-xs md:text-sm text-gray-300">
      <div class="font-bold text-gray-200 mb-2 flex justify-between">
        <span>持股追蹤部位</span>
        <span class="text-gray-400 font-normal">總持股成本：NT$ 7,212,180</span>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-gray-900/50 p-2.5 rounded border border-gray-800">
          <div class="font-bold text-white">群益臺灣加權正2 (00685L)</div>
          <div class="text-gray-400 mt-1">股數：624,000 股</div>
          <div class="text-gray-400">均價：10.22 元</div>
        </div>
        <div class="bg-gray-900/50 p-2.5 rounded border border-gray-800">
          <div class="font-bold text-white">元大台灣50 (0050)</div>
          <div class="text-gray-400 mt-1">股數：11,000 股</div>
          <div class="text-gray-400">均價：75.90 元</div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-6 text-center text-xs text-gray-500">
    提示：點擊任何日期方格可直接手動補正收盤價。
  </div>

  <!-- 單日彈窗 -->
  <div id="dayModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-700 rounded-xl max-w-sm w-full p-5 shadow-2xl">
      <h3 id="modalDateTitle" class="text-lg font-bold mb-3 text-white">收盤價校正</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">00685L 收盤價 (元)</label>
          <input type="number" step="0.01" id="input00685L" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">0050 收盤價 (元)</label>
          <input type="number" step="0.05" id="input0050" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white">
        </div>
      </div>
      <div class="flex justify-between items-center mt-5">
        <button onclick="clearDayPrice()" class="text-xs text-red-400 hover:underline">清除此日</button>
        <div class="flex space-x-2">
          <button onclick="closeDayModal()" class="px-3 py-1.5 text-sm bg-gray-800 rounded text-gray-300">取消</button>
          <button onclick="saveDayPrice()" class="px-4 py-1.5 text-sm bg-blue-600 rounded text-white font-medium">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 備份彈窗 -->
  <div id="backupModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-700 rounded-xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-lg font-bold mb-2 text-white">資料備份與匯入</h3>
      <textarea id="jsonBackupArea" rows="8" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-xs text-gray-200 font-mono"></textarea>
      <div class="flex justify-between items-center mt-4">
        <button onclick="closeBackupModal()" class="px-3 py-1.5 text-sm bg-gray-800 rounded text-gray-300">關閉</button>
        <button onclick="importJsonData()" class="px-4 py-1.5 text-sm bg-blue-600 rounded text-white font-medium">匯入</button>
      </div>
    </div>
  </div>

  <script>
    const PORTFOLIO = {
      "00685L": { shares: 624000, cost: 6377280 },
      "0050": { shares: 11000, cost: 834900 }
    };
    const TOTAL_COST = 7212180;

    let priceHistory = JSON.parse(localStorage.getItem("portfolio_price_history")) || {};
    let activeYear = 2026;
    let activeMonth = 11;
    let activeSelectedDate = null;

    // 自動加載同一目錄下的 data.json
    async function syncDataJson() {
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (res.ok) {
          const remoteData = await res.json();
          priceHistory = { ...priceHistory, ...remoteData };
          localStorage.setItem("portfolio_price_history", JSON.stringify(priceHistory));
          renderCalendar();
        }
      } catch (e) {
        console.log("尚未產生 data.json 或讀取失敗，使用本機儲存資料");
      }
    }

    function formatNumber(num) {
      if (Math.abs(num) >= 10000) {
        return (num / 10000).toFixed(1) + "萬";
      }
      return Math.round(num).toLocaleString();
    }

    function calculateMarketValue(prices) {
      if (!prices || prices["00685L"] === undefined || prices["0050"] === undefined) return null;
      return (PORTFOLIO["00685L"].shares * prices["00685L"]) + (PORTFOLIO["0050"].shares * prices["0050"]);
    }

    function getDailyStats(dateStr) {
      const todayPrice = priceHistory[dateStr];
      if (!todayPrice || todayPrice["00685L"] === undefined || todayPrice["0050"] === undefined) {
        return { pnl: 0, ret: 0, hasData: false };
      }

      const allDates = Object.keys(priceHistory).sort();
      const idx = allDates.indexOf(dateStr);
      const currVal = calculateMarketValue(todayPrice);

      if (idx <= 0) {
        const pnl = currVal - TOTAL_COST;
        const ret = (pnl / TOTAL_COST) * 100;
        return { pnl, ret, hasData: true };
      }

      const prevPrice = priceHistory[allDates[idx - 1]];
      const prevVal = calculateMarketValue(prevPrice);
      const pnl = currVal - prevVal;
      const ret = prevVal ? (pnl / prevVal) * 100 : 0;
      return { pnl, ret, hasData: true };
    }

    function renderCalendar() {
      document.getElementById("currentMonthLabel").textContent = `${activeYear}/${String(activeMonth).padStart(2, '0')} 報酬`;
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      const daysInMonth = new Date(activeYear, activeMonth, 0).getDate();
      let currentWeekDays = [];
      let weekCounter = 1;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(activeYear, activeMonth - 1, day);
        const dayOfWeek = dateObj.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) continue;

        const dateStr = `${activeYear}-${String(activeMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        currentWeekDays.push({ day, dayOfWeek, dateStr });

        if (dayOfWeek === 5 || day === daysInMonth) {
          renderWeekRow(grid, currentWeekDays, weekCounter++);
          currentWeekDays = [];
        }
      }

      const monthPrefix = `${activeYear}-${String(activeMonth).padStart(2, '0')}`;
      const monthDates = Object.keys(priceHistory).filter(d => d.startsWith(monthPrefix)).sort();

      let monthTotalPnl = 0;
      monthDates.forEach(d => {
        const stats = getDailyStats(d);
        if (stats.hasData) monthTotalPnl += stats.pnl;
      });

      const pnlEl = document.getElementById("monthlyPnlVal");
      const retEl = document.getElementById("monthlyReturnVal");
      pnlEl.textContent = (monthTotalPnl > 0 ? "+" : "") + Math.round(monthTotalPnl).toLocaleString();
      pnlEl.className = `text-2xl md:text-3xl font-extrabold mt-1 tracking-tight ${monthTotalPnl > 0 ? 'gain-text' : monthTotalPnl < 0 ? 'loss-text' : 'neutral-text'}`;

      const totalRet = (monthTotalPnl / TOTAL_COST) * 100;
      retEl.textContent = (totalRet > 0 ? "+" : "") + totalRet.toFixed(2) + "%";
      retEl.className = `text-2xl md:text-3xl font-extrabold mt-1 tracking-tight ${totalRet > 0 ? 'gain-text' : totalRet < 0 ? 'loss-text' : 'neutral-text'}`;
    }

    function renderWeekRow(grid, days, weekIdx) {
      let weekTotalPnl = 0;
      let hasWeekData = false;

      for (let w = 1; w <= 5; w++) {
        const item = days.find(d => d.dayOfWeek === w);
        if (!item) {
          const emptyCell = document.createElement("div");
          emptyCell.className = "cell-empty min-h-[75px] md:min-h-[85px] rounded-lg p-2";
          grid.appendChild(emptyCell);
          continue;
        }

        const stats = getDailyStats(item.dateStr);
        if (stats.hasData) {
          weekTotalPnl += stats.pnl;
          hasWeekData = true;
        }

        const cell = document.createElement("div");
        const isUp = stats.pnl > 0;
        const isDown = stats.pnl < 0;
        const bgClass = !stats.hasData ? "cell-empty" : (isUp ? "cell-gain" : isDown ? "cell-loss" : "cell-empty");

        cell.className = `${bgClass} min-h-[75px] md:min-h-[85px] rounded-lg p-2 cursor-pointer transition hover:opacity-80 flex flex-col justify-between`;
        cell.onclick = () => openDayModal(item.dateStr);

        cell.innerHTML = `
          <div class="text-xs text-gray-400 font-bold">${item.day}</div>
          <div class="text-center">
            ${stats.hasData ? `
              <div class="text-xs md:text-sm font-black ${isUp ? 'gain-text' : isDown ? 'loss-text' : 'neutral-text'}">
                ${(stats.pnl > 0 ? "+" : "") + formatNumber(stats.pnl)}
              </div>
              <div class="text-[10px] md:text-xs font-semibold ${isUp ? 'gain-text' : isDown ? 'loss-text' : 'neutral-text'}">
                ${(stats.ret > 0 ? "+" : "") + stats.ret.toFixed(2)}%
              </div>
            ` : `<div class="text-[10px] text-gray-600 mt-2">未記錄</div>`}
          </div>
          <div></div>
        `;
        grid.appendChild(cell);
      }

      const weekCell = document.createElement("div");
      const isWeekUp = weekTotalPnl > 0;
      const isWeekDown = weekTotalPnl < 0;
      weekCell.className = "cell-week min-h-[75px] md:min-h-[85px] rounded-lg p-2 flex flex-col justify-between text-center";
      weekCell.innerHTML = `
        <div class="text-xs text-amber-500 font-bold self-end">${weekIdx}</div>
        <div>
          ${hasWeekData ? `
            <div class="text-xs md:text-sm font-black ${isWeekUp ? 'gain-text' : isWeekDown ? 'loss-text' : 'neutral-text'}">
              ${(weekTotalPnl > 0 ? "+" : "") + formatNumber(weekTotalPnl)}
            </div>
          ` : `<div class="text-[10px] text-gray-600">-</div>`}
        </div>
        <div class="text-[9px] text-gray-500">週總計</div>
      `;
      grid.appendChild(weekCell);
    }

    function openDayModal(dateStr) {
      activeSelectedDate = dateStr;
      document.getElementById("modalDateTitle").textContent = `${dateStr} 收盤價校正`;
      const current = priceHistory[dateStr] || {};
      document.getElementById("input00685L").value = current["00685L"] !== undefined ? current["00685L"] : "";
      document.getElementById("input0050").value = current["0050"] !== undefined ? current["0050"] : "";
      document.getElementById("dayModal").classList.remove("hidden");
    }

    function closeDayModal() {
      document.getElementById("dayModal").classList.add("hidden");
    }

    function saveDayPrice() {
      const p685 = parseFloat(document.getElementById("input00685L").value);
      const p50 = parseFloat(document.getElementById("input0050").value);

      if (!isNaN(p685) && !isNaN(p50)) {
        priceHistory[activeSelectedDate] = { "00685L": p685, "0050": p50 };
        localStorage.setItem("portfolio_price_history", JSON.stringify(priceHistory));
        renderCalendar();
      }
      closeDayModal();
    }

    function clearDayPrice() {
      if (priceHistory[activeSelectedDate]) {
        delete priceHistory[activeSelectedDate];
        localStorage.setItem("portfolio_price_history", JSON.stringify(priceHistory));
        renderCalendar();
      }
      closeDayModal();
    }

    function changeMonth(delta) {
      activeMonth += delta;
      if (activeMonth < 1) { activeMonth = 12; activeYear--; }
      if (activeMonth > 12) { activeMonth = 1; activeYear++; }
      renderCalendar();
    }

    function openBackupModal() {
      document.getElementById("jsonBackupArea").value = JSON.stringify(priceHistory, null, 2);
      document.getElementById("backupModal").classList.remove("hidden");
    }

    function closeBackupModal() {
      document.getElementById("backupModal").classList.add("hidden");
    }

    function importJsonData() {
      try {
        const parsed = JSON.parse(document.getElementById("jsonBackupArea").value);
        if (typeof parsed === "object" && parsed !== null) {
          priceHistory = parsed;
          localStorage.setItem("portfolio_price_history", JSON.stringify(priceHistory));
          renderCalendar();
          closeBackupModal();
          alert("匯入成功！");
        }
      } catch (e) {
        alert("格式錯誤");
      }
    }

    // 啟動時先載入本機與 data.json
    renderCalendar();
    syncDataJson();
  </script>
</body>
</html>
