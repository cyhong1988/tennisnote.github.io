<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>損益日曆</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#888;--cell:#f3f3f3;--up:#d9534f;--dn:#2e8b57;--upbg:#f8dcdc;--dnbg:#d6ecde;--line:#ccc}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f2;--mut:#999;--cell:#262628;--up:#ff5a5a;--dn:#3fbf63;--upbg:#5a2224;--dnbg:#26482f;--line:#555}}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0 auto;padding:12px;max-width:560px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.top button{background:none;border:0;color:var(--fg);font-size:24px;padding:4px 12px}
.big{display:flex;justify-content:space-between;font-size:28px;font-weight:600;margin:6px 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(5,1fr) 1.15fr;gap:4px}
.h{text-align:center;color:var(--mut);font-size:13px;padding:4px}
.c{background:var(--cell);border-radius:8px;min-height:64px;padding:4px;font-size:11px;text-align:right;color:var(--mut);cursor:pointer}
.c b{display:block;font-size:13px;color:var(--fg);margin-top:6px}
.c.u{background:var(--upbg)}.c.d{background:var(--dnbg)}
.c.m{border:1px dashed var(--line);background:transparent}
.c.x{opacity:.35;cursor:default}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}
.note{color:var(--mut);font-size:12px;margin-top:12px;line-height:1.6}
/* 數字輸入彈窗樣式 */
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:18px;width:270px;max-width:85vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 14px;font-size:16px}
dialog label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
dialog input{width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;font-size:18px;border:1px solid var(--line);border-radius:8px;background:var(--cell);color:var(--fg)}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btns button{border:0;border-radius:8px;padding:8px 16px;font-size:15px;cursor:pointer;background:var(--cell);color:var(--fg)}
.btns button[type=submit]{background:var(--up);color:#fff;font-weight:600}
</style></head><body>
<div class="top"><button id="p">‹</button><span id="t"></span><button id="n">›</button></div>
<div class="big"><span id="mp"></span><span id="mr"></span></div>
<div class="sub" id="sum"></div>
<div class="g" id="g"></div>
<div class="note">點任一交易日格子，可輸入／修改當日收盤價（0050、00685L）。虛線格＝缺收盤價，待填。資料存在本機瀏覽器。<br>損益 = 持股數 ×（當日收盤 − 前一交易日收盤），報酬率以前一日持股市值為基準；假設區間內持股數不變。</div>

<!-- 數字鍵盤專用輸入視窗 -->
<dialog id="dlg">
  <form method="dialog" id="frm">
    <h3 id="dt"></h3>
    <label>0050 收盤價
      <input id="ia" type="text" inputmode="decimal" pattern="[0-9.]*" placeholder="留空＝不變">
    </label>
    <label>00685L 收盤價
      <input id="ib" type="text" inputmode="decimal" pattern="[0-9.]*" placeholder="留空＝不變">
    </label>
    <div class="btns">
      <button type="button" id="cancel">取消</button>
      <button type="submit">儲存</button>
    </div>
  </form>
</dialog>

<script>
// ===== 設定 =====
const SH={a:11000,b:624000};          // a=0050股數, b=00685L股數
const START="2026-09-01";             // 從此日起計算
const HOL=new Set(["2026-09-25","2026-09-28","2026-10-09","2026-10-23","2026-10-26"]); // 休市日
const DEFAULT={
"2026-08-31":{a:106.25},
"2026-09-01":{a:108.45},"2026-09-02":{a:106.80},"2026-09-03":{a:106.20,b:11.69},"2026-09-04":{a:107.90},
"2026-09-07":{a:109.90},"2026-09-08":{a:109.65},"2026-09-09":{a:109.65},"2026-09-10":{a:109.15,b:12.26},"2026-09-11":{a:107.70},
"2026-09-14":{a:106.90},"2026-09-15":{a:106.25,b:11.55},"2026-09-16":{a:106.90},"2026-09-17":{a:108.05,b:11.98},"2026-09-18":{a:109.85},
"2026-09-23":{b:12.89},"2026-09-24":{b:12.87},"2026-09-29":{b:12.64},"2026-09-30":{b:12.91},
"2026-10-01":{b:13.10},"2026-10-02":{b:13.12},"2026-10-05":{b:13.76},"2026-10-06":{b:13.87},
"2026-10-07":{a:116.05,b:13.84},"2026-10-08":{a:114.95,b:13.53},"2026-10-12":{a:114.80,b:13.55},
"2026-10-13":{a:112.40,b:13.02},"2026-10-14":{a:113.00,b:13.20},"2026-10-15":{a:108.90,b:12.26},"2026-10-16":{a:109.00,b:12.32},
"2026-10-19":{a:108.15,b:12.07},"2026-10-20":{a:107.25,b:11.84},"2026-10-21":{a:108.15,b:12.13},"2026-10-22":{a:106.90,b:11.78},
"2026-10-27":{a:106.60,b:11.75},"2026-10-28":{a:108.65,b:12.21},"2026-10-29":{a:107.25,b:11.86},"2026-10-30":{a:104.95,b:11.24},
"2026-11-02":{a:104.10,b:11.17},"2026-11-03":{a:100.60,b:10.31},"2026-11-04":{a:99.85,b:10.14},"2026-11-05":{a:97.15,b:9.50},"2026-11-06":{a:92.50,b:8.56},
"2026-11-09":{a:97.45,b:9.39},"2026-11-10":{a:99.70,b:9.85},"2026-11-11":{a:103.20,b:10.54}
};
// ===== 程式 =====
let CL=JSON.parse(JSON.stringify(DEFAULT));
try{const s=JSON.parse(localStorage.getItem("cl2")||"{}");for(const k in s)CL[k]=Object.assign(CL[k]||{},s[k])}catch(e){}
const save=()=>{try{localStorage.setItem("cl2",JSON.stringify(CL))}catch(e){}};
const iso=d=>d.toISOString().slice(0,10);
const D=k=>new Date(k+"T00:00:00Z");
const isTrade=k=>{const w=D(k).getUTCDay();return w>0&&w<6&&!HOL.has(k)};
function prevTrade(k){let d=D(k);for(let i=0;i<10;i++){d.setUTCDate(d.getUTCDate()-1);const s=iso(d);if(isTrade(s))return s}}
function day(k){
 const c=CL[k],q=CL[prevTrade(k)];
 if(!c||!q||c.a==null||c.b==null||q.a==null||q.b==null)return null;
 return{pnl:SH.a*(c.a-q.a)+SH.b*(c.b-q.b),base:SH.a*q.a+SH.b*q.b};
}
const fmt=v=>{const a=Math.abs(v);return(v>0?"+":v<0?"-":"")+(a>=1e4?(a/1e4).toFixed(a>=1e6?0:1)+"萬":a.toFixed(0))};
const pc=(p,b)=>(p>0?"+":"")+(p/b*100).toFixed(2)+"%";
const cls=v=>v>0?"up":v<0?"dn":"";
const $=id=>document.getElementById(id);
let Y=2026,M=10,curK="";
function render(){
 $("t").textContent=`${Y}/${M+1} 報酬`;
 const last=new Date(Date.UTC(Y,M+1,0)).getUTCDate();
 let html=["一","二","三","四","五","週損益"].map(x=>`<div class="h">${x}</div>`).join("");
 let tot=0,b0=null,w={p:0,b:null},wk=0,cnt=0;
 const flush=()=>{html+=`<div class="c" style="cursor:default"><span>${++wk}</span>${w.b?`<b class="${cls(w.p)}">${fmt(w.p)}</b><span class="${cls(w.p)}">${pc(w.p,w.b)}</span>`:""}</div>`;w={p:0,b:null}};
 let lead=(new Date(Date.UTC(Y,M,1)).getUTCDay()+6)%7;if(lead>4)lead=0;
 for(let i=0;i<lead;i++){html+=`<div class="c x"></div>`;cnt++}
 for(let d=1;d<=last;d++){
  const k=iso(new Date(Date.UTC(Y,M,d))),w0=D(k).getUTCDay();if(w0==0||w0==6)continue;
  let inner="",c="c";
  if(!isTrade(k)){c+=" x";inner=`<span>${d}</span><b>休</b>`}
  else if(k<START){c+=" x";inner=`<span>${d}</span>`}
  else{
   const r=day(k);
   if(r){tot+=r.pnl;if(!b0)b0=r.base;if(!w.b)w.b=r.base;w.p+=r.pnl;
    c+=r.pnl>0?" u":r.pnl<0?" d":"";
    inner=`<span>${d}</span><b>${fmt(r.pnl)}</b><span>${pc(r.pnl,r.base)}</span>`}
   else{c+=" m";inner=`<span>${d}</span><b style="color:var(--mut);font-weight:400">待填</b>`}
  }
  html+=`<div class="${c}" data-k="${k}">${inner}</div>`;
  if(++cnt%5==0)flush();
 }
 if(cnt%5){while(cnt%5){html+=`<div class="c x"></div>`;cnt++}flush()}
 $("g").innerHTML=html;
 $("mp").textContent=b0?(tot>0?"+":"")+Math.round(tot).toLocaleString():"—";
 $("mr").textContent=b0?pc(tot,b0):"";
 $("mp").className=$("mr").className=cls(tot);
 // 自 START 累計
 let all=0,miss=0,n=0,d=D(START);const end=D("2026-12-31");
 for(;d<=end;d.setUTCDate(d.getUTCDate()+1)){const k=iso(d);if(!isTrade(k))continue;
  if(!CL[k]&&k>"2026-11-12")continue;
  const r=day(k);if(r){all+=r.pnl;n++}else if(CL[k]||k<="2026-11-12")miss++}
 $("sum").textContent=`自 ${START.slice(5).replace("-","/")} 累計 ${fmt(all)}（已計 ${n} 天，缺價 ${miss} 天）`;
 document.querySelectorAll(".c[data-k]").forEach(el=>el.onclick=()=>edit(el.dataset.k));
}
function edit(k){
 if(!isTrade(k))return;
 curK=k;
 const c=CL[k]||{};
 $("dt").textContent=k;
 $("ia").value=c.a??"";
 $("ib").value=c.b??"";
 $("dlg").showModal();
 $("ia").focus();
}
$("cancel").onclick=()=>$("dlg").close();
$("dlg").onclick=e=>{if(e.target===$("dlg"))$("dlg").close()};
$("frm").onsubmit=()=>{
 const c=Object.assign({},CL[curK]||{});
 const a=$("ia").value.trim(),b=$("ib").value.trim();
 if(a!==""&&!isNaN(+a))c.a=+a;
 if(b!==""&&!isNaN(+b))c.b=+b;
 CL[curK]=c;
 save();render();
};
$("p").onclick=()=>{M--;if(M<0){M=11;Y--}render()};
$("n").onclick=()=>{M++;if(M>11){M=0;Y++}render()};
render();
</script></body></html>
